[package]
name = "continuum-ffi"
description = "The C ABI over continuum-client (include/continuum.h) and a header-only C++20 wrapper (include/continuum.hpp)"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "continuum"
# cdylib and staticlib for C and C++ callers (libcontinuum.so / .dylib / .a); rlib so the Rust tests can call the ABI.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
continuum-client = { path = "../continuum-client" }
continuum-core.workspace = true
continuum-shm.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
continuum-broker = { path = "../continuum-broker" }
continuum-wire.workspace = true
flatbuffers.workspace = true
libc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "sync"] }

[lints]
workspace = true
