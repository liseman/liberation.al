# The C header for continuum-ffi: `mise run continuum-ffi-header` writes include/continuum.h, and continuum-check
# fails if it's stale.
language = "C"
include_guard = "CONTINUUM_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
header = """/* The Continuum Broker C ABI (continuum-ffi). Generated by cbindgen from crates/continuum-ffi/src; don't edit.
 * C++ callers can include continuum.hpp, a header-only C++20 wrapper with RAII leases. */"""

[export]
prefix = ""
include = []

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = false
