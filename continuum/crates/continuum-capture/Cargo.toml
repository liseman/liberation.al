[package]
name = "continuum-capture"
description = "Continuum Broker capture: the supervisor and one capture worker per physical device"
version.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# Network H.264 stays native; optional local MJPEG capture encoding uses the shared FFmpeg codec implementation.
ffmpeg = ["dep:ffmpeg-next", "continuum-tier/ffmpeg"]

[dependencies]
continuum-log.workspace = true
tracing.workspace = true
continuum-tier.workspace = true
chrono.workspace = true
ffmpeg-next = { version = "9", optional = true }
continuum-client = { path = "../continuum-client" }
continuum-core.workspace = true
continuum-shm.workspace = true
flatbuffers.workspace = true
libc.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
uuid.workspace = true
zune-jpeg = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_50"] }
v4l = "0.14"


[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", features = ["block2", "dispatch2", "objc2-core-media", "objc2-core-video"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
jpeg-encoder = "0.7"
continuum-broker = { path = "../continuum-broker" }
continuum-catalog.workspace = true
continuum-sched.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints]
workspace = true
