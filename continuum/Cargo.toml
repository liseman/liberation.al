[workspace]
resolver = "3"
members = [
    "crates/continuum-broker",
    "crates/continuum-capture",
    "crates/continuum-catalog",
    "crates/continuum-client",
    "crates/continuum-core",
    "crates/continuum-ffi",
    "crates/continuum-gateway",
    "crates/continuum-log",
    "crates/continuum-py",
    "crates/continuum-search",
    "crates/continuum-segments",
    "crates/continuum-sched",
    "crates/continuum-shm",
    "crates/continuum-tier",
    "crates/continuum-vector",
    "crates/continuum-wire",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
# redb 4.4 and later require Rust 1.90; continuum-vector declares its higher floor separately.
rust-version = "1.90"

[workspace.dependencies]
continuum-catalog = { path = "crates/continuum-catalog" }
continuum-core = { path = "crates/continuum-core" }
continuum-gateway = { path = "crates/continuum-gateway" }
continuum-log = { path = "crates/continuum-log" }
continuum-search = { path = "crates/continuum-search" }
continuum-sched = { path = "crates/continuum-sched" }
continuum-shm = { path = "crates/continuum-shm" }
continuum-tier = { path = "crates/continuum-tier" }
continuum-wire = { path = "crates/continuum-wire" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
dlpark = { version = "0.10", features = ["pyo3"] }
flatbuffers = "25"
libc = "0.2"
proptest = "1.12"
redb = "4.4"
serde = { version = "1.0", features = ["derive"] }
pyo3 = "0.30"
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
uuid = { version = "1.29", features = ["v7"] }
zstd = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"

# continuum-vector-worker is nearly all LanceDB code, and most of that is code it runs rarely or never: the SQL
# parser and DataFusion's planner and function library (a filter is parsed and planned once per query), the
# namespace clients, and the dataset layer above the scan. Those packages are built for size, which took the
# stripped worker from 243 MB to under 150 MB. The packages that do the work per row stay at the default level:
# the arrow kernels, lance-linalg (distances), lance-index (search and the full-text index), lance-encoding, and
# lance-file. Only the vector worker links any package named here; a package another daemon links stays out.
#
# Built for the smallest code ("z"): parsing, planning, catalogs, and clients.
[profile.release.package.sqlparser]
opt-level = "z"
[profile.release.package.datafusion]
opt-level = "z"
[profile.release.package.datafusion-catalog]
opt-level = "z"
[profile.release.package.datafusion-catalog-listing]
opt-level = "z"
[profile.release.package.datafusion-common]
opt-level = "z"
[profile.release.package.datafusion-datasource]
opt-level = "z"
[profile.release.package.datafusion-datasource-arrow]
opt-level = "z"
[profile.release.package.datafusion-datasource-csv]
opt-level = "z"
[profile.release.package.datafusion-datasource-json]
opt-level = "z"
[profile.release.package.datafusion-expr]
opt-level = "z"
[profile.release.package.datafusion-expr-common]
opt-level = "z"
[profile.release.package.datafusion-functions]
opt-level = "z"
[profile.release.package.datafusion-functions-aggregate]
opt-level = "z"
[profile.release.package.datafusion-functions-aggregate-common]
opt-level = "z"
[profile.release.package.datafusion-functions-nested]
opt-level = "z"
[profile.release.package.datafusion-functions-table]
opt-level = "z"
[profile.release.package.datafusion-functions-window]
opt-level = "z"
[profile.release.package.datafusion-functions-window-common]
opt-level = "z"
[profile.release.package.datafusion-optimizer]
opt-level = "z"
[profile.release.package.datafusion-physical-optimizer]
opt-level = "z"
[profile.release.package.datafusion-pruning]
opt-level = "z"
[profile.release.package.datafusion-session]
opt-level = "z"
[profile.release.package.datafusion-sql]
opt-level = "z"
[profile.release.package.lance-namespace]
opt-level = "z"
[profile.release.package.lance-namespace-impls]
opt-level = "z"
[profile.release.package.lance-namespace-reqwest-client]
opt-level = "z"
[profile.release.package.prost]
opt-level = "z"
[profile.release.package.prost-types]
opt-level = "z"

# Built for size without giving up loop optimizations ("s"): what runs once per batch or per commit.
[profile.release.package.datafusion-execution]
opt-level = "s"
[profile.release.package.datafusion-physical-expr]
opt-level = "s"
[profile.release.package.datafusion-physical-expr-adapter]
opt-level = "s"
[profile.release.package.datafusion-physical-expr-common]
opt-level = "s"
[profile.release.package.datafusion-physical-plan]
opt-level = "s"
[profile.release.package.lance]
opt-level = "s"
[profile.release.package.lancedb]
opt-level = "s"
[profile.release.package.lance-datafusion]
opt-level = "s"
[profile.release.package.lance-io]
opt-level = "s"
[profile.release.package.lance-table]
opt-level = "s"
[profile.release.package.moka]
opt-level = "s"
