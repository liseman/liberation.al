# Linked-device history from Bluetooth sightings and router inventories.
[devices]
# Who is home and where my things are.
# Devices linked to people or named as things (pack-devices link), from Bluetooth sightings and the router's client
# list. Nothing alerts.
# Sightings of one device no more than this many seconds apart are one stay; longer quiet is "left".
gap_s = 600
# Names for the Wi-Fi access points the router reports by MAC alone: one "MAC: name" each, like
# "aa:bb:cc:dd:ee:ff: Living room". Known › Devices shows where a device was seen by this name; an access point
# with none shows the router's name for it, else its MAC.
access_points = []
# Hours of sightings used for person-presence questions.
lookback_h = 12
# Days back object-location questions look, a day at a time.
thing_lookback_days = 30

[bluetooth]
# New feature: Bluetooth sensors
# Enables the optional pack-bluetooth service. New settings require all config readers to restart after upgrade.
enabled = false
# ESP32 serial is preferred. Replay reads local BLE1 JSONL; optional bluez/corebluetooth use host OS discovery.
source = "esp32"
# Required separately for bluez/corebluetooth: OS discovery may send scan requests, so it is not strictly passive.
# Never automatically used when an ESP32 is absent. No backend connects, pairs, or reads GATT attributes.
allow_active_scan = false
# BlueZ adapter name/path (empty chooses the first powered adapter); CoreBluetooth's sensor label (empty=system-default).
host_adapter = ""
# Bounded OS callback queue. Overflow is reported as incomplete coverage, never inferred absence.
host_queue_size = 512
# Empty autodetects Espressif native USB and common ESP32 USB bridges; explicit ttyACM/ttyUSB/macOS paths win.
serial_ports = []
# CHIPID=name strings override each board's NVS name without writing to it. Empty uses its name or chip ID.
sensor_names = []
# Serial baud used by the supplied firmware (native USB Serial/JTAG also accepts it).
baudrate = 115200
# Simultaneously connected sensors. More ports than this limit are not opened.
max_sensors = 8
# Aggregate repeated backend reports per sensor and native advertiser identifier for this many seconds.
aggregate_seconds = 5.0
# Pending native identifiers and payload-match fingerprints at most. Capacity loss is explicit in coverage.
max_devices = 1024
# Combined sightings, unconfirmed candidates, and coverage records per second (3 through 500).
max_records_per_second = 50
# Local BLE1 JSONL used only with source=replay; empty disables replay.
replay_path = ""


[unifi]
# Local controller literal-IP HTTPS URL; never a cloud endpoint. Credentials stay in local pack.toml.
url = ""
username = ""
password = ""
api_key = ""
# UniFi OS uses /proxy/network; standalone Network uses its direct API.
unifi_os = true
# legacy cookie login, or integration with a local read-only API key.
mode = "legacy"
verify_tls = true
# Optional local CA certificate file. Prefer this to disabling TLS verification.
ca_file = ""
timeout_seconds = 5.0

[unifi_protect]
# Optional separate UniFi OS console running Protect (an NVR or Cloud Key), when Protect is not on the [unifi]
# console. Empty url uses [unifi] for Protect too. Same meanings as [unifi]; credentials stay in local pack.toml.
url = ""
username = ""
password = ""
api_key = ""
unifi_os = true
mode = "legacy"
verify_tls = true
ca_file = ""
timeout_seconds = 5.0

[network_devices]
# Read-only inventories. Off until explicitly enabled; new keys require all config readers to restart.
enabled = false
observer = "local-network"
site = "default"
# Poll interval, bounded to 30 through 3600 seconds.
poll_seconds = 60.0
max_devices = 1024
# Empty chooses the platform cache. These passive caches never establish current presence.
arp_path = ""
linux_arp_path = "/proc/net/arp"
# Existing local dnsmasq, ISC, or Apple DHCP lease files; no DHCP requests are sent.
dhcp_lease_paths = []


[network_cameras]
# Optional camera credentials for explicit read-only ONVIF discovery and its RTSP stream.
# Never used for background probing; a stream URL with its own credentials keeps those.
onvif_username = ""
onvif_password = ""
# Literal private IPv4 addresses that also get a unicast WS-Discovery probe, for cameras that miss multicast
# (often on Wi-Fi). When [unifi] is configured, its current clients are probed the same way. At most 256 hosts,
# one UDP datagram each; no port scanning.
onvif_hosts = []
