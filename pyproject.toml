[project]
name = "liberational-pack"
version = "0.1.0"
description = "Wearable ambient AI assistant: always-on audio, vision, memory, and voice."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "numpy",
    "opencv-python",
    "pillow",
    "psutil",
    "requests",
    "scipy",
    "sherpa-onnx",
    "sounddevice",
    "soundfile",
    "uvicorn",
    # Apple Silicon: in-process ASR, TTS, and VLM on MLX.
    "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Listed here and capped in the voice-clone extra so uv resolves the two platforms separately: the Macs keep
    # the newest transformers while Linux voice cloning stays below 5.17 (see the extra).
    "transformers>=5.22.1 ; sys_platform == 'darwin'",
    "parakeet-mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "num2words>=0.5.14",
    "kokoro-onnx>=0.6.1 ; platform_machine != 'arm64' or sys_platform != 'darwin'",
    "python-multipart>=0.0.32",
    "websockets>=17.3",
    "tomlkit>=0.15.2",
    # Linux x86_64 uses the CUDA build of ONNX Runtime in place of the CPU one (see [tool.uv] below). Without the CUDA
    # libraries (the faces extra brings them) it runs on the CPU like the plain build.
    "onnxruntime-gpu>=1.31.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Person detection for recorded-video crossing counts (vision/crossings.py) runs on ONNX Runtime everywhere; the
    # faces extra used to be the only place the CPU/CoreML build came from.
    "onnxruntime>=1.31.0 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "orjson>=3.13.0",
    # Continuum's Python SDK (continuum/), built from source by maturin on uv sync, so uv sync needs the Rust
    # toolchain (rustup). The ported speech path talks to the broker through it.
    "continuum-py[numpy]",
    "pyserial>=3.5",
    # Time zones for zoneinfo where the system has none (a minimal image has no /usr/share/zoneinfo).
    "tzdata>=2026.6",
]

[project.optional-dependencies]
# Native Qwen3-ASR for the scheduled deep transcription pass; no vLLM or forced aligner.
deep-asr = ["torch>=2.11", "transformers>=5.13", "librosa>=0.11"]
# Face recognition (vision/faces.py).
faces = [
    "insightface",
    "onnxruntime ; sys_platform != 'linux' or platform_machine != 'x86_64'",
    # CUDA and cuDNN from pip, so face detection runs on an NVIDIA GPU with no system cuDNN install.
    "onnxruntime-gpu[cuda,cudnn]>=1.31.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# OAK-D depth camera demo (tools/oakd_demo.py).
oakd = ["depthai"]
# ReSpeaker XVF3800 mic array control over USB (audio/xvf3800.py).
mic-array = ["pyusb"]
# Google Photos in the Ingest tab (ingest/sources/google_photos.py): a browser profile the owner signs in to once.
ingest = ["playwright"]
# Voice cloning on Linux with an NVIDIA GPU: Qwen3-TTS (the model the Macs run on MLX) through faster-qwen3-tts,
# which streams with CUDA graphs (speech/voice_clone.py).
voice-clone = [
    "faster-qwen3-tts>=0.5.4 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # qwen-tts-hf's torchaudio is built against torch 2.11, despite its unbounded torch metadata.
    "torch==2.11.* ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # torchaudio 2.11.1 fails to import with torch 2.11.0: libtorchaudio.so cannot resolve
    # torch_exception_get_what_without_backtrace. Keep the working ABI pair until a compatible build is available.
    "torchaudio==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # qwen-tts-hf 0.1.1.post1 reads MimiConfig.rope_theta, which transformers 5.17 moved into rope_parameters
    # ("'MimiConfig' object has no attribute 'rope_theta'" on load). 5.16.1 works; lift the cap when it's fixed.
    "transformers<5.17 ; sys_platform != 'darwin'",
]
# Prompted object masks on CUDA, Apple Silicon MPS, or CPU (vision/segmentation.py).
# Linux shares the existing voice-clone constraints above when both extras are installed.
segmentation = [
    "timm>=1.0.31",
    "torch>=2.11",
    "torchvision>=0.26",
    "transformers>=5.16.1",
]
# Optional host advertisement discovery; ESP32 serial needs neither these packages nor OS scan authorization.
host-bluetooth = [
    "dbus-fast>=5.2.0 ; sys_platform == 'linux'",
    "pyobjc-framework-corebluetooth>=13.0 ; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch>=13.0 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.13",
    "pytest",
    "ruff>=0.17.2",
    # Pinned: before 1.0 a ty release can change what it reports, so bump it on purpose and fix what it finds.
    "ty==0.0.98",
]

[project.scripts]
# Daemons
pack-vlm = "liberational.vision.vlm_server:main"
pack-dashboard = "liberational.dashboard.server:main"
pack-demo = "liberational.demo.cli:main"
pack-voice = "liberational.assistant.voice:main"
pack-listen = "liberational.listen.worker:main"
pack-knowledge = "liberational.knowledge_cli:main"
pack-rename-camera = "liberational.camera_rename:main"
pack-reset-catalog = "liberational.reset_catalog:main"
pack-reset-places = "liberational.spatial.reset:main"
pack-ingest = "liberational.ingest.runner:main"
pack-ingest-analyze = "liberational.ingest.analyze:main"
pack-deep-transcribe = "liberational.listen.deep:main"
pack-devices = "liberational.proximity.devices:main"
pack-catalog-stats = "liberational.catalog_stats:main"
pack-video-window = "liberational.video_window:main"
pack-surroundings = "liberational.spatial.surroundings_worker:main"
pack-positions = "liberational.spatial.positions:main"
pack-see-objects = "liberational.see.object_worker:main"
pack-identity = "liberational.people.identity:main"
pack-journal = "liberational.memory.journal:main"
pack-see-captions = "liberational.see.caption_worker:main"
pack-see-decode = "liberational.see.decoded_worker:main"
pack-see-actions = "liberational.see.actions_worker:main"
pack-bluetooth = "liberational.proximity.worker:main"
pack-network-devices = "liberational.proximity.network_worker:main"
pack-see-zones = "liberational.see.zones_worker:main"
pack-research = "liberational.memory.research:main"
pack-whisper = "liberational.speech.whisper_service:main"
pack-whisper-names = "liberational.people.whisper_names:main"
pack-audio-route = "liberational.audio.route:main"
pack-phone-bridge = "liberational.phone.bridge:main"
# Tools and CLIs
pack-config = "liberational.config:main"
pack-services = "liberational.services:main"
pack-supervisor = "liberational.supervisor:main"
pack-app = "liberational.app_window:main"
pack-continuum-status = "liberational.continuum_status:main"
pack-models = "liberational.fetch_models:main"
pack-setup = "liberational.pack_setup:main"
pack-system = "liberational.system_packages:main"
pack-camera-history = "liberational.vision.camera_history:main"
pack-ask = "liberational.memory.ask:main"
pack-faces = "liberational.vision.faces:main"
pack-people = "liberational.people.profiles:main"
pack-registry = "liberational.people.registry:main"
pack-voice-clone = "liberational.speech.voice_clone:main"
pack-clone-say = "liberational.speech.clone_say:main"
pack-clone-tts = "liberational.speech.clone_tts_cli:main"
pack-call = "liberational.phone.call:main"
pack-phone-call = "liberational.phone.call:main"
pack-call-eval = "liberational.phone.eval:main"
pack-call-review = "liberational.phone.review:main"
pack-xvf3800 = "liberational.audio.xvf3800:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Keep the Mac model stack current instead of resolving it down to Linux voice-clone versions. These
# constraints only apply when a dependency is selected; they do not install optional Torch extras.
constraint-dependencies = [
    # Linux Gradio still requires mdit-py-plugins 0.3, which caps markdown-it-py below 3.
    "markdown-it-py>=4.2.0 ; sys_platform == 'darwin'",
    # torch 2.11 on Linux requires setuptools<82; newer Mac Torch supports the current major.
    "setuptools>=84.2.1 ; sys_platform == 'darwin'",
    "huggingface-hub>=2.4.0 ; sys_platform == 'darwin'",
    "torch>=2.15.0 ; sys_platform == 'darwin'",
    "torchvision>=0.29.2 ; sys_platform == 'darwin'",
]
# onnxruntime and onnxruntime-gpu install the same `onnxruntime` module, so the CPU build that insightface and
# kokoro-onnx ask for is left out where the CUDA build is used.
override-dependencies = ["onnxruntime ; sys_platform != 'linux' or platform_machine != 'x86_64'"]

[tool.uv.sources]
# Not editable: an editable maturin install would rebuild on import. continuum/pyproject.toml's cache-keys make uv
# rebuild the wheel when the Rust or the Python package changes, and reuse it otherwise.
continuum-py = { path = "continuum", editable = false }

[tool.uv.build-backend]
module-name = "liberational"

[tool.ruff]
line-length = 120
src = ["src", "tests", "tools"]
extend-exclude = [".claude", "docs"]

[tool.ruff.lint]
# Ruff's default rule set plus annotations on every function (the code is typed; ty checks it), minus rules that
# fight deliberate patterns in this codebase.
extend-select = ["ANN", "TID253"]
ignore = [
    "ANN401",  # Any is the honest type for JSON payloads and other values whose shape the code doesn't fix
    "BLE001",  # daemons catch broad exceptions on purpose so one bad frame or request doesn't kill them
    "S110",    # same: try/except/pass around optional or best-effort work
    "S112",    # same, in loops
    "C408",    # dict(key=value) is used deliberately for readability
    "FURB167", # re.I vs re.IGNORECASE is churn
    "PLW1510", # subprocess return codes are checked explicitly where they matter
    "UP031",   # printf-style formatting in log calls
    "RUF046",  # int(round(x)) is not redundant when x is a numpy float
    "TRY004",  # changing the exception type raised would change what callers catch
    "TRY401",  # the call review job reads these log messages as they are
]

[tool.ruff.lint.per-file-ignores]
# Tests are type-checked by ty, but their functions and fixtures don't need annotations.
"tests/**" = ["ANN"]
# Continuum's own Python is where continuum_py is built and used.
"continuum/**" = ["TID253"]
# The ported speech path imports continuum_py at runtime; the rest of v1 still may only for types.
"src/liberational/speech_log.py" = ["TID253"]
"src/liberational/room_audio.py" = ["TID253"]  # imported only when audio is read (speech_log.SpeechLog.audio)
"tests/test_speech_log.py" = ["ANN", "TID253"]
"tests/test_voice_continuum.py" = ["ANN", "TID253"]
# The ported vision path, and the broker connection the ported readers share.
"src/liberational/vision_log.py" = ["TID253"]
"src/liberational/proximity/network_worker.py" = ["TID253"]  # Native Continuum network inventory producer.
"src/liberational/proximity/worker.py" = ["TID253"]  # New Continuum BLE sensor producer.
"src/liberational/people/pets.py" = ["TID253"]  # native pet.profile assertions, with no v1 disk store
"src/liberational/dashboard/pets.py" = ["TID253"]  # native broker failure handling for pet routes
"tests/test_pets.py" = ["ANN", "TID253"]
"src/liberational/continuum_link.py" = ["TID253"]
"tests/test_continuum_link.py" = ["ANN", "TID253"]
"src/liberational/proximity/devices.py" = ["TID253"]  # device links as native owner assertions
"tests/test_devices.py" = ["ANN", "TID253"]
"src/liberational/video_window.py" = ["TID253"]  # the nightly video window, a broker client
"tests/test_video_window.py" = ["ANN", "TID253"]
"tests/test_vision_log.py" = ["ANN", "TID253"]
# The ported memory path: the journal streams.
"src/liberational/memory_log.py" = ["TID253"]
"tests/test_memory_log.py" = ["ANN", "TID253"]
"tests/test_journal.py" = ["ANN", "TID253"]
"src/liberational/see/face_boxes.py" = ["TID253"]  # the face.boxes ring, a broker client
"src/liberational/see/frames.py" = ["TID253"]
"src/liberational/see/decoded_worker.py" = ["TID253"]  # native shared camera decode owner
"src/liberational/see/shared_frames.py" = ["TID253"]  # native source header types for decoded frames
"src/liberational/see/caption_worker.py" = ["TID253"]
"src/liberational/see/zones_worker.py" = ["TID253"]
"tests/test_see_zones_worker.py" = ["ANN", "TID253"]
"tests/test_see_decoded_worker.py" = ["ANN", "TID253"]  # synthetic shared decoder broker boundary
"tests/test_movement_restart.py" = ["ANN", "TID253"]
"tests/test_activity_restart.py" = ["ANN", "TID253"]
"tests/test_people_delete_continuum.py" = ["ANN", "TID253"]
"tests/test_see_caption_worker.py" = ["ANN", "TID253"]
"tests/camera_fake.py" = ["ANN", "TID253"]
"tests/test_see_frames_decode.py" = ["ANN", "TID253"]
"src/liberational/listen/**" = ["TID253"]
"tests/test_listen*.py" = ["ANN", "TID253"]
# Ingest registers its media on Continuum (ingest/broker.py).
"src/liberational/ingest/broker.py" = ["TID253"]
"tests/test_ingest*.py" = ["ANN", "TID253"]

[tool.ruff.lint.flake8-tidy-imports]
# v1 code imports continuum_py only for types (inside `if TYPE_CHECKING:`), so a v1 module never needs the broker.
# The modules ported onto Continuum are exempt (per-file-ignores above); uv sync installs continuum_py.
banned-module-level-imports = ["continuum_py"]

[tool.ruff.lint.isort]
known-first-party = ["liberational"]

[tool.ty.environment]
python-version = "3.14"
root = ["src", "tests", "tools"]
# continuum_py's pure-Python schema types and its native module's stub, for src/liberational/continuum.py's
# type-only import (the native module itself is built only in continuum/.venv).
extra-paths = ["continuum/python"]

[tool.ty.src]
include = ["src", "tests", "tools"]

[tool.ty.analysis]
# Optional extras and platform-only packages: present only where they apply (MLX on Apple Silicon, kokoro-onnx
# everywhere else, the mic array, the OAK-D, web search, faces, CUDA voice cloning, deep ASR, segmentation, and the
# model export tools). Code that imports them guards the import, so a missing one
# is not an error. Listing them also lets a fresh worktree, whose venv has no extras, pass `mise run lint`.
allowed-unresolved-imports = [
    "mlx.**",
    "mlx_vlm.**",
    "mlx_audio.**",
    "parakeet_mlx.**",
    "kokoro_onnx.**",
    "usb.**",
    "playwright.**",
    "depthai",
    "insightface.**",
    "onnx.**",
    "torch.**",
    "torchaudio.**",
    "transformers.**",
    "faster_qwen3_tts.**",
    "huggingface_hub.**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
