# Toolchain and common tasks. With mise installed (https://mise.jdx.dev):
#   mise trust && mise install && mise run setup

[tools]
gitleaks = "latest" # the secret scan in the privacy check (tools/privacy_check.py, .githooks/)
uv = "latest"
node = "latest"     # builds and tests the dashboard frontend (frontend/)
ollama = "latest"   # local LLM and VLM server
ffmpeg = "latest"   # continuous video recording, and converting ingested media (ingest/)
yt-dlp = "latest"   # the Ingest tab's links to pages rather than files (ingest/sources/link.py)
cmake = "latest"    # builds whisper-server (mise run whisper); also needs a C++ compiler and git
# The FlatBuffers compiler for the Continuum schema, pinned to the flatbuffers crate's release: its Rust output must
# match that runtime, and continuum-check compares it byte for byte. Bump both together.
flatc = "25.12.19"
# Generates the Continuum C header (mise run continuum-ffi-header), pinned because continuum-check compares its
# output byte for byte.
"cargo:cbindgen" = "0.29.4"
# The protobuf compiler, which LanceDB (continuum-vector) runs while it builds.
protoc = "latest"
# A compile cache shared by every worktree: each one otherwise compiles the whole Continuum dependency tree into its
# own target dir. Used through RUSTC_WRAPPER below.
sccache = "latest"

[env]
# Rust builds go through sccache when it's installed (mise install), so worktrees share compiled crates; an empty
# value (no sccache) means no wrapper, and cargo builds as before. To override, run one command with RUSTC_WRAPPER
# set (empty for none), or set it under [env] in mise.local.toml (docs/CONTINUUM-SDK.md, "Building").
RUSTC_WRAPPER = { value = "{{ get_env(name='RUSTC_WRAPPER', default=exec(command='command -v sccache || true')) }}", tools = true }
# One build of the whole Continuum tree is several GB in the cache, and the debug, check (clippy), and ffmpeg builds
# each cache their own; sccache's 10 GiB default would evict what the next worktree needs. Set it yourself to override.
SCCACHE_CACHE_SIZE = "{{ get_env(name='SCCACHE_CACHE_SIZE', default='40G') }}"

[tasks.setup]
description = "Install the system packages that are missing (after asking), Python dependencies (with face recognition, object segmentation, deep ASR, and voice cloning on NVIDIA GPUs), build whisper-server and the dashboard frontend, fetch models, and turn on the git hooks"
depends = ["system", "whisper", "frontend", "hooks"]
# The voice-clone extra (CUDA PyTorch, a few GB) only where there's an NVIDIA GPU to run it.
run = [
    "uv sync --extra faces --extra segmentation --extra deep-asr $(command -v nvidia-smi >/dev/null && echo --extra voice-clone)",
    "uv run pack-models",
]

[tasks.system]
description = "Install the system packages config/system-packages.toml declares and this machine is missing (shows the command and asks first)"
raw = true  # it asks before running sudo apt-get or brew, so it needs the terminal
# --no-project runs pack-system before uv sync builds continuum-py, so the FFmpeg and PipeWire headers are installed first.
run = "PYTHONPATH=src uv run --no-project python -m liberational.system_packages install"

[tasks.whisper]
description = "Build whisper.cpp's whisper-server into data/whisper.cpp (CUDA with nvcc, Metal on Apple Silicon, else CPU; safe to re-run)"
depends = ["system"]  # a C++ compiler and git
env = { WHISPER_CPP_VERSION = "v1.9.5", WHISPER_CPP_DIR = "data/whisper.cpp" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
D="$WHISPER_CPP_DIR"; V="$WHISPER_CPP_VERSION"
if [ -x "$D/build/bin/whisper-server" ] && [ "$(cat "$D/VERSION" 2>/dev/null)" = "$V" ]; then
  echo "whisper-server $V already built in $D"; exit 0
fi
rm -rf "$D/src" "$D/build"
git clone --quiet --depth 1 --branch "$V" https://github.com/ggml-org/whisper.cpp "$D/src"
flags=(-DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF)
if command -v nvcc >/dev/null; then flags+=(-DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=native); fi
cmake -S "$D/src" -B "$D/build" "${flags[@]}"
cmake --build "$D/build" --config Release -j --target whisper-server whisper-cli
echo "$V" > "$D/VERSION"
echo "built $D/build/bin/whisper-server ($V)"
'''

[tasks.frontend-deps]
description = "Install the frontend's npm packages from frontend/package-lock.json (skipped while they're current)"
wait_for = ["system"]
dir = "frontend"
sources = ["package.json", "package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "../tools/niced.sh npm ci --no-audit --no-fund"

[tasks.frontend]
description = "Build the dashboard frontend (frontend/) into src/liberational/dashboard/static/app/ (skipped while it's current)"
depends = ["frontend-deps"]
dir = "frontend"
sources = ["*.html", "*.ts", "*.mjs", "*.json", "src/**/*", "plan-editor/*.html", "public/**/*"]
outputs = ["../src/liberational/dashboard/static/app/.vite/manifest.json"]
run = "../tools/niced.sh npm run build"

[tasks.playwright]
description = "Fetch the headless Chromium Playwright takes screenshots with, once per machine and again after a Playwright upgrade (opt-in, not part of setup: about 280 MB on disk; see the screenshots rule in AGENTS.md)"
depends = ["frontend-deps"]
dir = "frontend"
run = "../tools/niced.sh npx --no-install playwright install --only-shell chromium"

[tasks.hooks]
description = "Use the repo's git hooks in .githooks/ (pre-commit refuses gitignored files, such as runtime data under data/, leftover conflict markers, and private data (tools/privacy_check.py, which also checks commit messages and pushes); pre-merge-commit refuses conflict markers a merge would bring in, and pre-push those in the commits being pushed; post-merge, post-checkout, and post-rewrite rebuild the frontend when frontend/ changed)"
wait_for = ["system"]
run = ["git config core.hooksPath .githooks", "python3 tools/privacy_check.py denylist"]

[tasks.wheel]
description = "Build the frontend, then the package's wheel into dist/, and check the wheel carries the settings, the service declarations, the frontend build, and the commands (tools/check_wheel.py)"
depends = ["frontend"]
run = [
    "uv build --wheel --out-dir dist",
    "python3 tools/check_wheel.py dist",
]

[tasks.models]
description = "Fetch any missing models declared in config/defaults.toml (safe to re-run)"
run = "uv run pack-models"

# The checks below run at the lowest CPU and disk priority (tools/niced.sh: nice and ionice on Linux, nice and
# taskpolicy on macOS), so they never crowd out the live services or the person at the computer.

[tasks.test]
description = "Run the whole Python and JS test suites (only when a person asks: mise run test-changed is the usual check)"
depends = ["frontend-deps"]
run = ["tools/niced.sh uv run pytest", "tools/niced.sh npm --prefix frontend test"]

[tasks.test-changed]
description = "Run only the tests that cover what changed against origin/main (tools/test_changed.py; -- --dry-run to see them)"
depends = ["frontend-deps"]
run = "tools/niced.sh uv run tools/test_changed.py"

[tasks.lint]
description = "Lint with Ruff and Biome, check formatting (what mise run fmt would change), and type-check with ty and tsc"
depends = ["frontend-deps"]
run = [
  "tools/niced.sh uv run ruff check",
  "tools/niced.sh uv run ruff format --check",
  "tools/niced.sh uv run ty check",
  "tools/niced.sh npm --prefix frontend run lint",
  "cd frontend && ../tools/niced.sh npx --no-install biome format",
]

[tasks.typecheck]
description = "Type-check with ty and tsc"
depends = ["frontend-deps"]
run = ["tools/niced.sh uv run ty check", "tools/niced.sh npm --prefix frontend run typecheck"]

[tasks.fmt]
description = "Format with Ruff and Biome, and apply safe lint fixes"
depends = ["frontend-deps"]
run = ["tools/niced.sh uv run ruff format", "tools/niced.sh uv run ruff check --fix", "tools/niced.sh npm --prefix frontend run fmt"]

[tasks.dashboard]
description = "Run the pack dashboard on http://localhost:8765/"
run = "uv run pack-dashboard"

[tasks.demo]
description = "Run the dashboard on the made-up demo household (http://localhost:8780/ unless that port is taken), apart from any real data"
run = "uv run pack-demo"

[tasks.dev]
description = "Run the dashboard with auto-reload (restarts on Python or config changes) and Vite's dev server, which hot-reloads the frontend"
depends = ["frontend-deps"]
# Vite's own binary, not `npm run dev`: npm runs it under a shell, so stopping npm would leave Vite holding its port.
run = """
port=$(uv run pack-config ports.vite)
export VITE_PORT="$port"  # for frontend/vite.config.ts: the port its hot reload connects back to
(cd frontend && exec node_modules/.bin/vite --port "$port") &
vite=$!
trap 'kill $vite 2>/dev/null; wait $vite 2>/dev/null' EXIT INT TERM
uv run pack-dashboard --dev
"""

# Continuum Broker (continuum/, docs/CONTINUUM.md): Rust commands keep standard priority and share one machine-wide
# build lock across the repository's worktrees (tools/build-slot.sh), with CARGO_BUILD_JOBS defaulting to 8.
# Full gates additionally share tools/gated.sh's gate lock; Python and other non-Rust checks stay niced.
# continuum-py's build needs a Python (PYO3_PYTHON); the tasks use continuum/.venv, a small venv of their own with
# maturin, NumPy, pytest, ruff, and ty, so they never touch the repo's .venv.

[tasks.continuum-venv]
description = "Make continuum/.venv, the venv the Continuum tasks build and test the Python bindings in (skipped while it's current)"
dir = "continuum"
# mise.toml too: the package list is here, so adding a package reinstalls into existing venvs.
sources = ["pyproject.toml", "../mise.toml"]
outputs = [".venv/bin/maturin"]
run = "uv venv -q --allow-existing --python 3.14 .venv && uv pip install -q --python .venv/bin/python maturin numpy pytest hypothesis ruff ty torch"

[tasks.continuum-codegen]
description = "Regenerate the Continuum schema's Rust code (continuum/schemas/continuum.fbs) with flatc"
dir = "continuum"
run = [
  "flatc --rust --gen-all -o crates/continuum-core/src/generated schemas/continuum.fbs",
  "flatc --rust --gen-all -o crates/continuum-gateway/src/generated schemas/overlay.fbs",
  "flatc --ts -o ../frontend/src/dashboard/player/generated schemas/overlay.fbs",
]

[tasks.continuum-ffi-header]
description = "Regenerate the Continuum C header (continuum/crates/continuum-ffi/include/continuum.h) with cbindgen"
dir = "continuum/crates/continuum-ffi"
run = "cbindgen --config cbindgen.toml --crate continuum-ffi --output include/continuum.h ."

[tasks.continuum-ffi-example]
description = "Build the C ABI, then the C++ example worker and the plain-C header check with the system compiler (CC/CXX pick another), and run them against a real broker"
dir = "continuum"
depends = ["continuum-venv"]
env = { PYO3_PYTHON = "{{config_root}}/continuum/.venv/bin/python" }
run = [
  "../tools/build-slot.sh cargo build -q -p continuum-ffi -p continuum-broker",
  "../tools/niced.sh crates/continuum-ffi/examples/cpp-worker/run.sh",
]

[tasks.continuum-build]
description = "Build the Continuum Rust workspace"
dir = "continuum"
depends = ["continuum-venv"]
env = { PYO3_PYTHON = "{{config_root}}/continuum/.venv/bin/python" }
run = "../tools/build-slot.sh cargo build --workspace --all-targets"

[tasks.continuum-release]
description = "Build the Continuum daemons in release mode and link them into .venv/bin, where the services find them; capture and the tier worker with FFmpeg for RTSP and media encoding"
dir = "continuum"
run = [
    "../tools/build-slot.sh cargo build --release --bins --features continuum-tier/ffmpeg,continuum-capture/ffmpeg",
    "../tools/link-daemons.sh",
]

[tasks.continuum-link]
description = "Link the Continuum daemons already built (continuum/target/release/) into .venv/bin, without building: needed once after the environment is made again"
run = "tools/link-daemons.sh"

[tasks.continuum-wheels]
description = "Build Continuum's wheels for this platform into continuum/dist/: the SDK and the daemons, with a private LGPL FFmpeg linked in (docs/CONTINUUM-SDK.md, Wheels). On Linux it builds in a Debian 12 container (needs Docker), so the wheels run on glibc 2.36 and later"
run = "tools/build-slot.sh continuum/packaging/wheels.sh"

[tasks.continuum-check]
description = "Check the Continuum workspace: rustfmt, clippy with warnings as errors, ruff and ty on the Python bindings, and that the generated schema code is current"
dir = "continuum"
depends = ["continuum-venv"]
env = { PYO3_PYTHON = "{{config_root}}/continuum/.venv/bin/python" }
# One full gate and one Rust command at a time per machine, shared by every worktree. The outer build lock
# covers all Rust steps at standard priority, with CARGO_BUILD_JOBS defaulting to 8. The shared target directory
# remains protected by the gate lock; non-Rust steps apply their own low priority in the script.
run = "GATE_PYTHON=.venv/bin/python ../tools/gated.sh ../tools/build-slot.sh ../tools/continuum-check.sh"

[tasks.continuum-status]
description = "Check that Continuum is up on this machine: each service, the broker, streams and their newest payloads, Tier 0 use, the tier worker's flush lag, and the gateway (exit 1 if anything's wrong; it changes nothing)"
run = ".venv/bin/python -m liberational.continuum_status"

[tasks.continuum-test]
description = "Run the Continuum workspace's tests: the Rust tests, the Python bindings' tests against a Rust frame producer and a real broker, and the C++ example worker against a real broker"
dir = "continuum"
depends = ["continuum-venv"]
env = { PYO3_PYTHON = "{{config_root}}/continuum/.venv/bin/python" }
# One full gate and one Rust command at a time per machine, shared by every worktree. The outer build lock
# covers all Rust steps at standard priority, with CARGO_BUILD_JOBS defaulting to 8. The shared target directory
# remains protected by the gate lock; non-Rust steps apply their own low priority in the script.
run = "GATE_PYTHON=.venv/bin/python ../tools/gated.sh ../tools/build-slot.sh ../tools/continuum-test.sh"

[tasks.continuum-py]
description = "Rebuild continuum_py (release) into the repo's .venv now, without a uv sync (uv sync builds and installs it too, since it's a path dependency); with the ffmpeg feature when pkg-config finds FFmpeg's development libraries, as the package build does"
dir = "continuum"
depends = ["continuum-venv"]
env = { VIRTUAL_ENV = "{{config_root}}/.venv", PYO3_PYTHON = "{{config_root}}/.venv/bin/python" }
run = """
features=$(.venv/bin/python -c 'import sys; sys.path.insert(0, "build_backend"); import continuum_build as b, os; print(b.FEATURE if b.ffmpeg_wanted(os.environ, b.ffmpeg_libs_present) else "")')
../tools/build-slot.sh .venv/bin/maturin develop --release $features --uv
"""

[tasks.continuum-py-ffmpeg]
description = "Rebuild continuum_py with optional H.264 decoding for RTSP vision; requires system FFmpeg headers"
dir = "continuum"
depends = ["continuum-venv"]
env = { VIRTUAL_ENV = "{{config_root}}/.venv", PYO3_PYTHON = "{{config_root}}/.venv/bin/python" }
run = "../tools/build-slot.sh .venv/bin/maturin develop --release --features ffmpeg --uv"

[tasks.ollama]
description = "Run an Ollama server (skip this if Ollama already runs as a system service)"
run = "ollama serve"

[tasks.esp32-ble-firmware]
description = "Build passive BLE sensor firmware and merged flash images with the declared ESP-IDF toolchain"
run = "tools/niced.sh firmware/esp32-ble-scanner/build.sh scratch/esp32-ble-scanner-v1"
